name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select newest Xcode
      run: |
        LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
        LATEST=${LATEST:-/Applications/Xcode.app}
        sudo xcode-select -s "$LATEST"
        xcodebuild -version

    - name: Build for iOS
      run: |
        xcodebuild build \
          -project "ehviewer apple.xcodeproj" \
          -scheme "ehviewer apple" \
          -destination "generic/platform=iOS" \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package unsigned IPA
      run: |
        set -euo pipefail
        APP=$(find build/Build/Products -maxdepth 4 -type d -name "*.app" | head -1)
        if [ -z "$APP" ]; then
          find build/Build/Products -maxdepth 3 -type d
          exit 1
        fi
        echo "APP=$APP"
        rm -rf Payload EhViewer-unsigned.ipa
        mkdir -p Payload
        cp -R "$APP" Payload/
        zip -qry EhViewer-unsigned.ipa Payload
        ls -lh EhViewer-unsigned.ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: EhViewer-unsigned-ipa
        path: EhViewer-unsigned.ipa
        if-no-files-found: error

    - name: Build for macOS
      run: |
        xcodebuild build \
          -project "ehviewer apple.xcodeproj" \
          -scheme "ehviewer apple" \
          -destination "platform=macOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
